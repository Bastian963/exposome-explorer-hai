specs:
  spatial_resolution: "100 m nativos; GEMMA exige un COG verificable por métrica"
  temporal_coverage: "Productos publicados: superficie y volumen 2020; altura neta media ANBH 2018. Son snapshots, no una serie anual."
  validation: "Cada ciudad exige tres TIFF sobre la grilla World Mollweide nativa de 100 m, resumen zonal calculado desde esos mismos píxeles, manifest v3, auditoría espacial estricta y control visual. Santiago y Bogotá conservan el piloto histórico como comparador de rangos."
limitations:
  - "Si falta un COG nativo verificable, GEMMA deja la métrica no disponible: nunca sustituye el píxel GHSL por un mapa administrativo."
  - "La altura usa específicamente ANBH 2018 (altura neta media); AGBH es otro producto y no es intercambiable."
  - "Superficie, volumen y altura construida pueden ser fuertemente colineales entre sí y con verde, transporte y servicios urbanos."
methodology_doc: docs/built_environment_ghsl_methodology.md
color: sequential
