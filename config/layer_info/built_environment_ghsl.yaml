  provider: "European Commission, Joint Research Centre"
  url: "https://human-settlement.emergency.copernicus.eu/datasets.php"
  dataset_id: "GHS-BUILT-S E2020, GHS-BUILT-V E2020, GHS-BUILT-H ANBH E2018 (P2023A)"
  license: "European Commission reuse authorised with JRC acknowledgement"
citation:
  authors: "Pesaresi, Martino and Politis, Panagiotis and others"
  year: 2024
  title: "Advances on the Global Human Settlement Layer by Joint Assessment of Earth Observation and Population Survey Data"
  journal: "International Journal of Digital Earth"
  doi: "10.1080/17538947.2024.2390454"
