source:
  name: "ERA5-Land Daily Aggregated — 2 m temperature and precipitation"
  provider: "ECMWF / Copernicus Climate Change Service, via Google Earth Engine"
  url: "https://developers.google.com/earth-engine/datasets/catalog/ECMWF_ERA5_LAND_DAILY_AGGR"
  license: "Copernicus Open Access"
citation:
  authors: "Muñoz-Sabater, Joaquín and others"
  year: 2021
  title: "ERA5-Land: a state-of-the-art global reanalysis dataset for land applications"
  journal: "Earth System Science Data"
  doi: "10.5194/essd-13-4349-2021"
