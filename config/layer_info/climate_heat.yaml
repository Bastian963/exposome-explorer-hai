specs:
  spatial_resolution: "~11.132 km (0.1°), aggregated by polygon-intersection area"
  temporal_coverage: "2024 master; annual products 2015-2024"
  validation: "Native ERA5-Land pixel metrics aggregated by area-weighted intersection; zero-intersection land units may use the nearest observed pixel within one 11.132 km grid spacing, explicitly flagged"
limitations:
  - "La grilla de ~11 km no captura microclimas intra-administrativos ni una isla de calor física a escala de barrio."
  - "La temperatura aparente usa la aproximación de Steadman con viento constante de 1 m/s."
  - "Una unidad sin píxel intersectante puede heredar el píxel ERA5-Land observado más cercano dentro de 11.132 km; el archivo publica la bandera y la distancia de ese fallback."
