limitations:
  - "Los mapas cubren aglomeraciones obligadas, no toda Cataluña ni todo el País Vasco."
  - "La media usa puntos medios de bandas; >75 dB(A) se aproxima como 77,5 dB(A)."
  - "Los conteos de población expuesta se conservan por aglomeración y no se redistribuyen artificialmente entre unidades administrativas."
