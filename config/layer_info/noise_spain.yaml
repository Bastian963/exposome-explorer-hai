specs:
  spatial_resolution: "Bandas vectoriales Lden de 5 dB; GEMMA publica sólo resumen por unidad administrativa"
  temporal_coverage: "Cuarta fase MER 2022"
  validation: "Las releases completas verifican 16 GeoPackage con CRC ZIP, integridad SQLite y capa all-sources Lden; el piloto Barcelonès declara explícitamente su subconjunto validado e intersectante"
