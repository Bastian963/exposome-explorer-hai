specs:
  spatial_resolution: "30 m nativos verificables; COG derivado conserva exactamente la grilla waterClass"
  temporal_coverage: "Anual 1984–2024; cada año usa un activo distinto (v1.4: 1984–2021, v1.5: 2022–2024)"
