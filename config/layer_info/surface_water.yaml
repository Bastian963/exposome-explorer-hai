limitations:
  - "Mide agua superficial observada por Landsat, no calidad, profundidad, acceso ni exposición individual."
  - "El cambio v1.4→v1.5 usa Landsat Collection 2 y puede introducir desplazamientos residuales; se revisa explícitamente el empalme 2021–2022."
studies:
