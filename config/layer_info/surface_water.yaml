      temporal_coverage: "2016–2024 anual publicado: primera ventana continua con ≥80% de área JRC observada en cada una de las 52 comunas; 1985–2015 se excluyen por cobertura insuficiente, no se imputan como 0%."
    coverage_note: "Sondeo JRC 1985–2024, umbral 80% por comuna-año; reporte local coverage_summary.json."
