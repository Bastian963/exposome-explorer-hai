specs:
  spatial_resolution: "70 m × 70 m"
  temporal_coverage: "2018-07-09 al presente; instantáneo, revisita 1-5 días según latitud"
  validation: "RMSE 1,07 K, MAE 0,40 K y R² > 0,988 contra estaciones terrestres en 14 sitios globales (1.139 observaciones de cielo despejado, ago-2018 a mar-2020; Hulley et al. 2022)"
coverage_note: >-
  Producto instantáneo y solo de cielo despejado: cada píxel resume las pasadas
  válidas del período, no una serie continua. La órbita precesante de la
  Estación Espacial Internacional hace que las adquisiciones caigan a horas
  solares locales variables, lo que permite caracterizar el ciclo diurno —
  ventaja que ningún sensor heliosincrónico ofrece — pero también implica que
  el número de observaciones por píxel varía en el espacio y entre años. La
  banda de conteo de observaciones se publica junto a las temperaturas para que
  esa desigualdad sea auditable.
limitations:
  - "Mide temperatura radiativa de superficie (piel), no temperatura del aire a 2 m. No sustituye a la capa de calor basada en ERA5-Land: son cantidades físicas distintas y sobre superficie construida difieren varios kelvin durante el día."
  - "Solo cielo despejado. En ciudades con nubosidad persistente el número de adquisiciones utilizables puede caer a un dígito por año, lo que puede impedir publicar una serie anual."
  - "El proveedor documenta huecos observacionales permanentes entre 2018 y 2023 por fallas de la unidad de almacenamiento masivo, además de bandeo en la banda 4 (feb-2020) y operación en modo TES de 3 bandas entre may-2019 y abr-2023."
  - "Obstrucciones de los paneles solares de la Estación Espacial pueden afectar la calidad; el campo de metadatos que las marca fue poblado de forma poco confiable antes de octubre de 2024."
  - "La validación de referencia reporta un sesgo frío por debajo de 295 K atribuido a calibración; el producto es más confiable en el rango cálido, que es el de interés para isla de calor."
  - "La serie parte en 2019 (primer año completo) y por lo tanto es más corta que las series climáticas de 2015 en adelante; nunca debe rellenarse para igualarlas."
