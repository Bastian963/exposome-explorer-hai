schema_version: 1
layer_id: precipitation
webapp_keys: [rain]
source:
  name: "CHIRPS Daily (UCSB-CHG/CHIRPS/DAILY)"
  provider: "UCSB Climate Hazards Center, via Google Earth Engine"
  url: "https://www.chc.ucsb.edu/data/chirps"
  license: "Open (research use)"
citation:
  authors: "Funk, Chris and others"
  year: 2015
  title: "The climate hazards infrared precipitation with stations — a new environmental record for monitoring extremes"
  journal: "Scientific Data"
  doi: "10.1038/sdata.2015.66"
  paper: "Funk et al. (2015) Scientific Data 2:150066"
  bibtex_key: funk2015
specs:
  spatial_resolution: "0.05° (~5.5 km)"
  temporal_coverage: "2015-2024 (daily)"
  validation: "Validación global de Funk et al. (2015) contra estaciones pluviométricas; sesgo conocido en zonas áridas (~5-15%)"
limitations:
  - "La resolución de 0.05° suaviza gradientes orográficos de precipitación."
methodology_doc: docs/precipitation_methodology.md
color: sequential
countries:
  CL:
    specs:
      validation: "RMSE ~5-15 mm/mes vs estaciones DMC; sobreestima ~5-15% en zonas áridas como la RM"
    limitations:
      - "La resolución de 0.05° suaviza la topografía andina y puede sub-representar gradientes orográficos de precipitación."
      - "Sin cross-check fino contra estaciones DGA/DMC en la capa canónica; brecha conocida documentada."
